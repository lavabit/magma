<!DOCTYPE HTML>
<html>
<head>
    <title>Magma Webmail - QUnit Test Suite</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="qunit/qunit.css" />
</head>
<body>
    <h1 id="qunit-header">Magma Webmail Test Suite</h1>
    <h2 id="qunit-banner"></h2>
    <div id="qunit-testrunner-toolbar"></div>
    <h2 id="qunit-userAgent"></h2>
    <ol id="qunit-tests"></ol>
    <div id="qunit-fixture"></div>

    <!-- Core libraries -->
    <script src="/js/jquery.js"></script>
    <script src="/js/plugins.js"></script>
    <script src="/js/script.js"></script>

    <!-- Test configuration -->
    <script>
        // Tests use mock interface
        magma.portalUrl = '/portal/mockiface';

        // QUnit configuration
        QUnit.config.testTimeout = 10000; // 10 second timeout for async tests
    </script>

    <!-- QUnit framework -->
    <script src="qunit/qunit.js"></script>

    <!-- Test modules -->
    <script src="modules/models/auth.js"></script>
    <script src="modules/models/message.list.js"></script>
    <script src="modules/models/compose.js"></script>
    <script src="modules/models/folders.js"></script>
    <script src="modules/security.js"></script>
    <script src="modules/button.js"></script>
    <script src="modules/folder-manager.js"></script>
    <script src="modules/tag-manager.js"></script>
    <script src="modules/compose-utils.js"></script>
    <script src="modules/settings-manager.js"></script>
    <script src="modules/contacts-manager.js"></script>
    <script src="modules/alerts-manager.js"></script>
    <script src="modules/logs-viewer.js"></script>
    <script src="modules/search-manager.js"></script>
    <script src="modules/help-system.js"></script>
</body>
</html>
